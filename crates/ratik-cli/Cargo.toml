[package]
name = "ratik-cli"
description = "The `ratik` binary: RatikDB server, shell and process manager in one file"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ratik"
path = "src/main.rs"

[dependencies]
ratikdb.workspace = true
ratik = { workspace = true, features = ["remote", "embedded"] }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["cors"] }
rustyline = "18.0.1"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.2", default-features = false, features = ["json"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
