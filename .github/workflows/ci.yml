name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, os: macos-14 }
          - { name: macOS Intel, os: macos-13 }
          - { name: Linux, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Smoke-test the binary
        run: |
          cargo build --release -p ratik-cli
          export RATIK_DATA="$RUNNER_TEMP/ratik" RATIK_PORT=7399
          ./target/release/ratik init "$RUNNER_TEMP"
          ./target/release/ratik start --apply "$RUNNER_TEMP/schema.rql"
          ./target/release/ratik status
          ./target/release/ratik query "SHOW NODES"
          ./target/release/ratik stop
