name: Release

# Push a tag like v0.1.0 to publish macOS (Apple Silicon, Intel, universal)
# and Linux binaries to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build universal binary
        run: scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo build --release --locked -p ratik-cli
          mkdir -p dist
          tar -C target/release -czf dist/ratik-x86_64-linux.tar.gz ratik
          (cd dist && shasum -a 256 ratik-x86_64-linux.tar.gz > ratik-x86_64-linux.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
